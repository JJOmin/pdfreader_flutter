# Builds the signed Android app and publishes it as a GitHub release, when a version tag is pushed:
#   git tag v0.1.0-alpha.3 && git push origin v0.1.0-alpha.3
# The tag must name the version in pubspec.yaml (the part before the +). A tag with a hyphen (-alpha.3,
# -beta.1) is published as a pre-release. Run by hand (Actions, Release, Run workflow) it builds and keeps
# the app as a downloadable artifact, without publishing: a rehearsal.
# It refuses to publish an app that is not signed with the owner's release key, so a debug-signed build
# can never be handed out.
#
# Secrets to set under Settings, Secrets and variables, Actions:
#   ANDROID_KEYSTORE_BASE64   the keystore file, base64 (base64 -i release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: \(.*\)+.*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but pubspec.yaml says ${version}. Change one of them."
            exit 1
          fi
      - name: The release key is there
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: a release is signed with the owner's key or not at all."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: ./.github/actions/pdfium
      - name: Test
        run: flutter test
      - name: Build
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: It is signed with the release key, not the debug key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The app is signed with the debug key."
            exit 1
          fi
      - name: Name the file for the release
        run: |
          # A branch name such as feature/x (a rehearsal) has a slash, which a file name cannot.
          name="Easy-Reader-${GITHUB_REF_NAME//\//-}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          name: Easy Reader for Android ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          # A version with a hyphen in it is an alpha or a beta.
          prerelease: ${{ contains(github.ref_name, '-') }}
      - uses: actions/upload-artifact@v7
        with:
          name: Easy-Reader-apk
          path: ${{ env.APK }}
          retention-days: 14
